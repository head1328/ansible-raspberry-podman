---
- name: Verify
  hosts: all
  become: false
  gather_facts: true

  vars:
    podman_user_name: testuser
    podman_user_group: podman

  tasks:
    - name: Verify podman is installed
      ansible.builtin.command:
        cmd: podman --version
      register: podman_version
      changed_when: false
      failed_when: podman_version.rc != 0

    - name: Verify podman group exists
      ansible.builtin.getent:
        database: group
        key: "{{ podman_user_group }}"
      register: podman_group_result
      failed_when: podman_group_result.ansible_facts.getent_group[podman_user_group] is not defined

    - name: Verify podman user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ podman_user_name }}"
      register: podman_user_result
      failed_when: podman_user_result.ansible_facts.getent_passwd[podman_user_name] is not defined

    - name: Verify podman user is in correct group
      ansible.builtin.command:
        cmd: "id -gn {{ podman_user_name }}"
      register: user_group
      changed_when: false
      failed_when: user_group.stdout != podman_user_group

    - name: Verify subuid configuration
      ansible.builtin.lineinfile:
        path: /etc/subuid
        line: "{{ podman_user_name }}:165536:65536"
        state: present
      check_mode: true
      register: subuid_check
      failed_when: subuid_check is changed

    - name: Verify subgid configuration
      ansible.builtin.lineinfile:
        path: /etc/subgid
        line: "{{ podman_user_group }}:165536:65536"
        state: present
      check_mode: true
      register: subgid_check
      failed_when: subgid_check is changed

    - name: Verify lingering is enabled
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ podman_user_name }}"
      register: linger_file
      failed_when: not linger_file.stat.exists

    - name: Verify systemd delegation configuration
      ansible.builtin.stat:
        path: /etc/systemd/system/user@.service.d/delegate.conf
      register: delegate_conf
      failed_when: not delegate_conf.stat.exists

    - name: Verify podman user home exists
      ansible.builtin.stat:
        path: "/home/{{ podman_user_name }}"
      register: podman_home
      failed_when: not podman_home.stat.isdir | default(false) or podman_home.stat.pw_name != podman_user_name

    - name: Read ansible user groups
      ansible.builtin.command:
        cmd: "id -Gn ansible"
      register: ansible_user_groups
      changed_when: false

    - name: Verify ansible user was removed from podman group only
      ansible.builtin.assert:
        that:
          - "'podman' not in ansible_user_groups.stdout.split()"
          - "'users' in ansible_user_groups.stdout.split()"

    - name: Read sudoers rule for podman
      ansible.builtin.slurp:
        path: /etc/sudoers.d/podman
      register: podman_sudoers
      become: true

    - name: Verify sudoers rule uses admin user
      ansible.builtin.assert:
        that:
          - "'ansible ALL=(root) NOPASSWD: /usr/bin/podman' in podman_sudoers.content | b64decode"
          - "'ansible ALL=(' ~ podman_user_name ~ ') NOPASSWD: /usr/bin/podman' in podman_sudoers.content | b64decode"

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Verify rootless dependencies are installed
      ansible.builtin.assert:
        that: item in ansible_facts.packages
      loop: [uidmap, passt, slirp4netns, dbus-user-session, catatonit, aardvark-dns, nftables]

    - name: Verify newuidmap is available
      ansible.builtin.stat:
        path: /usr/bin/newuidmap
      register: newuidmap
      failed_when: not newuidmap.stat.exists

    - name: Verify podman user has systemd-journal access
      ansible.builtin.command:
        cmd: "id -Gn {{ podman_user_name }}"
      register: user_groups
      changed_when: false
      failed_when: "'systemd-journal' not in user_groups.stdout"
