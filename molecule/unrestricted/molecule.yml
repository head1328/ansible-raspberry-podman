---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: podman

platforms:
  - name: instance
    image: debian:trixie
    dockerfile: Dockerfile.j2
    override_command: false
    privileged: true
    tmpfs:
      /run: "rw"
      /tmp: "rw"
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /var/tmp/ansible
      callbacks_enabled: ansible.posix.profile_tasks
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:~/.ansible/roles
  inventory:
    host_vars:
      instance:
        ansible_user: ansible
        ansible_become: true
        podman_enable_user_socket: false
  playbooks:
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
