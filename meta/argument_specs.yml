---
argument_specs:
  main:
    short_description: Main entrypoint for the podman role
    author: Kevin Horst <info@kevinhorst.de>

    options:
      podman_user_name:
        type: str
        required: true
        description:
          - Name of the user to be enabled for Podman.

      podman_user_group:
        type: str
        required: false
        description:
          - Name of the primary group for the Podman user.
          - Defaults to the same name as podman_user_name.

      podman_enable_user_socket:
        type: bool
        required: false
        default: true
        description:
          - Enable and start the Podman user socket (podman.socket).
          - If set to false, the user socket will not be enabled or started.

      podman_restrict_user:
        type: bool
        required: false
        default: true
        description:
          - Restrict podman usage to the podman user and to podman_admin_user via sudo.
          - If set to false, podman_admin_user is added to podman_user_group and can run podman directly.
          - In both modes /usr/bin/podman is only executable by members of podman_user_group.

      podman_admin_user:
        type: str
        required: false
        description:
          - User that gets podman access via sudo (restricted) or group membership (unrestricted).
          - Defaults to ansible_user, or empty if ansible_user is undefined.
          - Empty or root skips all admin user tasks.

      podman_packages:
        type: list
        elements: str
        required: false
        description:
          - Packages installed for rootless podman, including Recommends of podman and netavark.
